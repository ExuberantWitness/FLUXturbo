[project]
name = "ccchain"
version = "0.2.0"
description = "Claim Chain knowledge base for AI autonomous research"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.25",
    "numpy>=1.24",
    "igraph>=0.11",
    "scipy>=1.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ccchain*"]

[project.scripts]
ccchain = "ccchain.server:main"
